<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala da Mídia</title>
<script>
/* Mostra qualquer erro do script em uma faixa vermelha no topo da página */
window.addEventListener('error',function(e){
  var d=document.createElement('div');
  d.style.cssText='background:#fcebeb;color:#791f1f;padding:12px;margin:12px;border-radius:8px;font:14px system-ui,sans-serif';
  d.textContent='Erro na página: '+e.message+(e.lineno?' (linha '+e.lineno+')':'');
  function put(){document.body.insertBefore(d,document.body.firstChild);}
  if(document.body)put();else document.addEventListener('DOMContentLoaded',put);
});
</script>
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--card2:#efeee9;--text:#1f1f1d;--muted:#6b6a65;
  --border:rgba(0,0,0,.12);--accent-bg:#e3eefb;--accent-text:#0c447c;--accent:#378add;
  --lead-bg:#eeedfe;--lead-text:#3c3489;--ok-bg:#eaf3de;--ok-text:#27500a;
  --tr-bg:#faeeda;--tr-text:#633806;--ce-bg:#e1f5ee;--ce-text:#085041;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1b1b19;--card:#262624;--card2:#2f2f2c;--text:#f1efe8;--muted:#a3a29b;
    --border:rgba(255,255,255,.15);--accent-bg:#0c447c;--accent-text:#b5d4f4;--accent:#85b7eb;
    --lead-bg:#3c3489;--lead-text:#cecbf6;--ok-bg:#27500a;--ok-text:#c0dd97;
    --tr-bg:#633806;--tr-text:#fac775;--ce-bg:#085041;--ce-text:#9fe1cb;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;font-weight:500;margin:0 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
button,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.nav select{flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border-radius:999px;padding:5px 14px;font-size:14px}
.chip.on{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card2);border-radius:8px;padding:14px}
.stat p{margin:0}.stat .l{font-size:13px;color:var(--muted)}.stat .v{font-size:24px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.card.hit{border:2px solid var(--accent)}
.card.off{background:var(--card2)}
.head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.day{font-size:24px;font-weight:500}.dow{font-size:13px;color:var(--muted)}
.badges{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;font-size:15px}
.row.me{background:var(--accent-bg);color:var(--accent-text);font-weight:500}
.row.dim{color:var(--muted)}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex:none;background:hsl(var(--h) 70% 90%);color:hsl(var(--h) 60% 25%)}
@media (prefers-color-scheme:dark){.av{background:hsl(var(--h) 40% 25%);color:hsl(var(--h) 70% 85%)}}
.tag{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:8px;background:var(--lead-bg);color:var(--lead-text)}
.badges .tag{margin-left:0}
.tag.next{background:var(--ok-bg);color:var(--ok-text)}
.tag.train{background:var(--tr-bg);color:var(--tr-text)}
.tag.ceia{background:var(--ce-bg);color:var(--ce-text)}
.tag.mentor{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
.folga{font-size:13px;color:var(--muted);margin:6px 0 0 6px}
.swap{margin-top:12px;width:100%;font-size:13px;padding:6px 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
#msg{font-size:13px;color:var(--muted)}
#ta{display:none;width:100%;margin-top:10px;font-size:14px;cursor:text}
</style>
</head>
<body>
<div class="wrap">
  <h1>Escala da Mídia</h1>
  <p class="sub">Todo domingo: 1 líder e 2 apoios. Primeiro domingo do mês: Santa Ceia, com equipe ampliada. Último domingo do mês: quem está em formação assume a liderança, acompanhado por um mentor. Novembro de 2026 a dezembro de 2027.</p>

  <div class="nav">
    <button id="prev" aria-label="Mês anterior">&#8249;</button>
    <select id="mes" aria-label="Escolher mês"></select>
    <button id="next" aria-label="Próximo mês">&#8250;</button>
  </div>

  <div id="chips" class="chips" role="group" aria-label="Filtrar por pessoa"></div>
  <div id="stats" class="stats"></div>
  <div id="cards" class="cards"></div>

  <div class="actions">
    <button id="copy">Copiar mês para WhatsApp</button>
    <button id="wa">Falar no WhatsApp</button>
    <span id="msg"></span>
  </div>
  <textarea id="ta" rows="8" readonly></textarea>
</div>

<script>
(function(){

/* ===== CONFIGURAÇÕES (edite aqui) ===== */
var WHATS='5591980108918';   /* WhatsApp que recebe os pedidos de troca: 55 + DDD + número, só dígitos */
var CEIA_PADRAO=5;           /* pessoas na Santa Ceia, líder incluso: 4, 5 ou 6 */
var CEIA_TAM={               /* exceções por data, no formato 'AAAA-MM-DD':pessoas. Exemplo: '2027-01-03':6 */
};
/* ===== FIM DAS CONFIGURAÇÕES ===== */

var P={'Wellington':270,'Enzo':175,'João':215,'Andrei':25,'Alefe':130,'Lays':320};
var NOMES=['Wellington','Enzo','João','Andrei','Alefe','Lays'];
var LEAD=['Wellington','Enzo','João'];
var TR=['Andrei','Alefe','Lays'];
var CYC=[
  ['Wellington',['Andrei','Alefe']],
  ['Enzo',['Lays','João']],
  ['João',['Andrei','Lays']],
  ['Wellington',['Alefe','Enzo']],
  ['Enzo',['Lays','Wellington']],
  ['João',['Andrei','Alefe']]
];
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function p2(n){return String(n).padStart(2,'0');}
function el(id){return document.getElementById(id);}
function dkey(s){return s.d.toISOString().slice(0,10);}
function fdata(s){return p2(s.d.getUTCDate())+'/'+p2(s.d.getUTCMonth()+1)+'/'+s.d.getUTCFullYear();}

/* ----- 1) Rodízio base: todos os domingos ----- */
var S=[];
for(var i=0;i<58;i++){
  S.push({
    d:new Date(Date.UTC(2026,10,22+i*7)),
    l:CYC[i%6][0],
    a:CYC[i%6][1].slice(),
    treino:false,ceia:false,folga:[],m:''
  });
}

/* ----- 2) Último domingo do mês: líder em formação + mentor ----- */
var lastIdx={};
S.forEach(function(s,idx){
  lastIdx[s.d.getUTCFullYear()*12+s.d.getUTCMonth()]=idx;
});
Object.keys(lastIdx).map(Number).sort(function(a,b){return a-b;}).forEach(function(key,k){
  var s=S[lastIdx[key]];
  var novato=TR[k%TR.length];
  var mentor=s.l;
  var outro=s.a.filter(function(n){return n!==novato;})[0];
  s.l=novato;
  s.m=mentor;
  s.a=[mentor,outro];
  s.treino=true;
});

/* ----- 3) Primeiro domingo do mês: Santa Ceia ----- */
var ORDEM_FOLGA=['Lays','Wellington','Alefe','Enzo','Andrei','João'];
var folgas={};
ORDEM_FOLGA.forEach(function(n){folgas[n]=0;});
var kc=0;
S.forEach(function(s){
  if(s.d.getUTCDate()>7)return;
  var tam=CEIA_TAM[dkey(s)]||CEIA_PADRAO;
  tam=Math.min(6,Math.max(3,tam));
  var lider=LEAD[kc%LEAD.length];
  var folga=[];
  for(var j=0;j<6-tam;j++){
    var cand=ORDEM_FOLGA.filter(function(n){
      if(n===lider||folga.indexOf(n)>=0)return false;
      if(LEAD.indexOf(n)>=0){
        var restam=LEAD.filter(function(x){return x!==n&&folga.indexOf(x)<0;}).length;
        if(restam<2)return false;
      }
      return true;
    }).sort(function(a,b){return folgas[a]-folgas[b];});
    if(!cand.length)break;
    folga.push(cand[0]);
    folgas[cand[0]]++;
  }
  s.l=lider;
  s.a=NOMES.filter(function(n){return n!==lider&&folga.indexOf(n)<0;});
  s.folga=folga;
  s.ceia=true;
  kc++;
});

/* ----- 4) Meses disponíveis e estado ----- */
var M=[];
S.forEach(function(s){
  var y=s.d.getUTCFullYear(),m=s.d.getUTCMonth();
  if(!M.some(function(x){return x.y===y&&x.m===m;}))M.push({y:y,m:m});
});

var now=new Date();
var todayU=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
var nextS=S.filter(function(s){return s.d.getTime()>=todayU;})[0]||null;
var mi=0,sel='';
if(nextS){
  var f=-1;
  M.forEach(function(x,idx){
    if(x.y===nextS.d.getUTCFullYear()&&x.m===nextS.d.getUTCMonth())f=idx;
  });
  if(f>=0)mi=f;
}

var mesSel=el('mes');
M.forEach(function(x,idx){
  var o=document.createElement('option');
  o.value=idx;
  o.textContent=MESES[x.m]+' de '+x.y;
  mesSel.appendChild(o);
});

var chips=el('chips');
['Todos'].concat(NOMES).forEach(function(n){
  var b=document.createElement('button');
  b.className='chip';
  b.textContent=n;
  b.setAttribute('data-n',n==='Todos'?'':n);
  b.onclick=function(){sel=n==='Todos'?'':n;render();};
  chips.appendChild(b);
});

/* ----- 5) Desenho da tela ----- */
function av(n){
  return '<span class="av" style="--h:'+P[n]+'">'+n.slice(0,2).toUpperCase()+'</span>';
}
function rowHtml(n,kind){
  var c='row';
  if(sel&&n===sel)c+=' me';else if(sel)c+=' dim';
  var tag='';
  if(kind==='lead')tag='<span class="tag">Líder</span>';
  if(kind==='mentor')tag='<span class="tag mentor">Mentor</span>';
  return '<div class="'+c+'">'+av(n)+'<span>'+n+'</span>'+tag+'</div>';
}
function monthList(){
  var x=M[mi];
  return S.filter(function(s){return s.d.getUTCFullYear()===x.y&&s.d.getUTCMonth()===x.m;});
}
function serves(s,n){return s.l===n||s.a.indexOf(n)>=0;}
function metric(l,v){
  return '<div class="stat"><p class="l">'+l+'</p><p class="v">'+v+'</p></div>';
}

function render(){
  var list=monthList();
  mesSel.value=String(mi);
  el('prev').style.visibility=mi===0?'hidden':'visible';
  el('next').style.visibility=mi===M.length-1?'hidden':'visible';
  Array.prototype.forEach.call(chips.querySelectorAll('.chip'),function(c){
    c.classList.toggle('on',c.getAttribute('data-n')===sel);
  });

  el('cards').innerHTML=list.map(function(s){
    var hit=!sel||serves(s,sel);
    var cls='card';
    if(sel&&hit)cls+=' hit';
    if(sel&&!hit)cls+=' off';
    var isNext=nextS&&s.d.getTime()===nextS.d.getTime();
    var badges='';
    if(s.ceia)badges+='<span class="tag ceia">Santa Ceia</span>';
    if(s.treino)badges+='<span class="tag train">Formação</span>';
    if(isNext)badges+='<span class="tag next">Próximo</span>';
    var apoio=s.a.map(function(n){
      return rowHtml(n,(s.treino&&n===s.m)?'mentor':'');
    }).join('');
    var folga='';
    if(s.ceia&&s.folga.length)folga='<p class="folga">Folga: '+s.folga.join(', ')+'</p>';
    return '<div class="'+cls+'">'
      +'<div class="head">'
      +'<span class="day">'+p2(s.d.getUTCDate())+'</span>'
      +'<span class="dow">dom · '+MESES[s.d.getUTCMonth()].slice(0,3).toLowerCase()+'</span>'
      +'<span class="badges">'+badges+'</span>'
      +'</div>'
      +rowHtml(s.l,'lead')+apoio+folga
      +'<button class="swap" data-d="'+dkey(s)+'">Pedir troca</button>'
      +'</div>';
  }).join('');

  var st=metric('Domingos no mês',list.length);
  if(sel){
    var mine=list.filter(function(s){return serves(s,sel);}).length;
    var tot=S.filter(function(s){return serves(s,sel);}).length;
    var lead=S.filter(function(s){return s.l===sel;}).length;
    st=metric(sel+' no mês',mine)
      +metric('Total no período',tot)
      +metric(LEAD.indexOf(sel)>=0?'Como líder':'Como líder (formação)',lead);
  }else{
    st+=metric('Santa Ceias no período',S.filter(function(s){return s.ceia;}).length)
      +metric('Domingos de formação',S.filter(function(s){return s.treino;}).length);
  }
  el('stats').innerHTML=st;
  el('msg').textContent='';
  el('ta').style.display='none';
}

/* ----- 6) Texto para WhatsApp e pedido de troca ----- */
function texto(){
  var x=M[mi];
  var t='*Escala da Mídia - '+MESES[x.m]+'/'+x.y+'*\n';
  monthList().forEach(function(s){
    t+='\n'+p2(s.d.getUTCDate())+'/'+p2(s.d.getUTCMonth()+1)+' (dom)\n';
    if(s.ceia){
      t+='*Santa Ceia*\nLíder: '+s.l+'\nEquipe: '+s.a.join(', ')+'\n';
      if(s.folga.length)t+='Folga: '+s.folga.join(', ')+'\n';
    }else if(s.treino){
      var outro=s.a.filter(function(n){return n!==s.m;})[0];
      t+='Líder em formação: '+s.l+'\nMentor: '+s.m+'\nApoio: '+outro+'\n';
    }else{
      t+='Líder: '+s.l+'\nApoio: '+s.a.join(', ')+'\n';
    }
  });
  return t;
}

function abrirWa(msg){
  if(!/^[0-9]{10,15}$/.test(WHATS)){
    el('msg').textContent='Falta configurar o número do WhatsApp no código (linha WHATS).';
    return;
  }
  window.open('https://wa.me/'+WHATS+'?text='+encodeURIComponent(msg),'_blank');
}

el('cards').onclick=function(e){
  var b=e.target.closest('.swap');
  if(!b)return;
  var d=b.getAttribute('data-d');
  var s=S.filter(function(x){return dkey(x)===d;})[0];
  if(!s)return;
  var tipo=s.ceia?' (Santa Ceia)':(s.treino?' (domingo de formação)':'');
  abrirWa('Olá! Preciso de uma troca na escala da mídia.\n'
    +'Data: '+fdata(s)+', domingo'+tipo+'\n'
    +'Líder: '+s.l+'\n'
    +'Equipe: '+s.a.join(', ')+'\n'
    +'Meu nome: '+sel+'\n'
    +'Motivo: ');
};
el('wa').onclick=function(){abrirWa('Olá! Preciso falar sobre a escala da mídia.');};
el('prev').onclick=function(){if(mi>0){mi--;render();}};
el('next').onclick=function(){if(mi<M.length-1){mi++;render();}};
mesSel.onchange=function(){mi=Number(mesSel.value);render();};
el('copy').onclick=function(){
  var t=texto();
  function fb(){
    var ta=el('ta');
    ta.value=t;
    ta.style.display='block';
    ta.focus();
    ta.select();
    el('msg').textContent='Selecione e copie o texto abaixo.';
  }
  try{
    navigator.clipboard.writeText(t).then(function(){el('msg').textContent='Copiado';},fb);
  }catch(err){fb();}
};

render();

})();
</script>
</body>
</html>
